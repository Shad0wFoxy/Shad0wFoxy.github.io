<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />

        <link rel="stylesheet" type="text/css" href="../../globals.css" />
        <link rel="stylesheet" type="text/css" href="./style.css" />

        <title>Herbality</title>
    </head>
    <body>
        <div id="container">
            <h1 id="title">Herbality</h1>
            <nav id="navbar">
                <a href="../../index.html">Home</a>
                <a href="../history/index.html">Historia Herbaty</a>
                <a href="../types/index.html">Rodzaje Herbat</a>
                <a href="index.html">Galeria</a>
                <a href="../contact/index.html">Kontakt</a>
            </nav>
            <article id="main-content" class="gallery-wrapper">
              <header class="gallery-intro">
                <h2>Galeria</h2>
                <p>Od tradycyjnych plantacji i zbiorów po rzemieślnicze naczynia oraz rytuał parzenia.</p>
              </header>

              <section class="gallery-video-section">
                  <div class="video-frame">
                    <video controls poster="images/video-poster.jpg" preload="metadata">
                      <source src="../../videos/tea-ceremony.mp4" type="video/mp4">
                      Twoja przeglądarka nie obsługuje tagu wideo.
                    </video>
                  </div>
                  <p class="video-caption">Tradycyjny rytuał parzenia herbaty – sztuka spokoju i precyzji</p>
                </section>

              <div class="tea-grid">
                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/plantation.jpg" alt="Tarasy herbaciane we mgle" loading="lazy">
                  </div>
                  <figcaption>Tarasy herbaciane o poranku</figcaption>
                </figure>

                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/tea-leaves.jpg" alt="Świeżo zebrane liście herbaty" loading="lazy">
                  </div>
                  <figcaption>Świeży zbiór Camellia sinensis</figcaption>
                </figure>

                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/gaiwan.jpg" alt="Chińskie naczynie gaiwan z naparem" loading="lazy">
                  </div>
                  <figcaption>Ceremonia Gongfu Cha z naczyniem Gaiwan</figcaption>
                </figure>

                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/matcha.jpg" alt="Tradycyjna miska z matchą i miotełką chasen" loading="lazy">
                  </div>
                  <figcaption>Japońska matcha i miotełka Chasen</figcaption>
                </figure>

                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/dried-tea-leaves.jpg" alt="Różne rodzaje suszu herbacianego" loading="lazy">
                  </div>
                  <figcaption>Różnorodność liści i stopni utlenienia</figcaption>
                </figure>

                <figure class="tea-card">
                  <div class="image-frame">
                    <img src="../../images/yinxing-teapot.jpg" alt="Klasyczny gliniany czajnik z Yixing" loading="lazy">
                  </div>
                  <figcaption>Tradycyjny czajniczek z fioletowej gliny</figcaption>
                </figure>
              </div>
            </article>
            <footer>Tymon Błachut &nbsp; &copy; 2026</footer>
        </div>
    </body>
</html>
